<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Aurora ✦ A Friendship Universe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- SCENE CONTAINER -->
  <div id="scene"></div>

  <!-- UNIVERSE CANVAS -->
  <canvas id="universeCanvas"></canvas>

  <!-- UI OVERLAY -->
  <div id="uiOverlay">
    <div class="input-panel">
      <div class="icon">🌌</div>
      <h1>Project <strong>Aurora</strong></h1>
      <p class="sub">A Friendship Universe</p>

      <form id="nameForm">
        <div class="input-group">
          <label for="name1">Your name</label>
          <input type="text" id="name1" placeholder="Enter your name" maxlength="30" autocomplete="off" />
        </div>
        <div class="input-group">
          <label for="name2">Friend's name</label>
          <input type="text" id="name2" placeholder="Enter friend's name" maxlength="30" autocomplete="off" />
        </div>
        <div class="form-error" id="formError">✨ Both names are needed to create a universe</div>
        <button type="submit" class="btn-generate" id="generateBtn">
          <span>✦ Create Universe ✦</span>
        </button>
      </form>
    </div>
  </div>

  <!-- SECRET ENDING -->
  <div id="secretEnding">
    <div class="text">
      "Some friendships aren't written in books...<br>
      they're written across the universe."
    </div>
  </div>

  <!-- EASTER EGG HINT -->
  <div id="easterEggHint">✦ tap the stars ✦</div>

  <script src="script.js"></script>
</body>
</html>
