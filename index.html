<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Aurora ✦ A Friendship Universe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a12;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    /* ---------- SCENE CONTAINER ---------- */
    #scene {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #0a0a1a 0%, #050510 100%);
      transition: background 2s ease;
    }

    /* ---------- CANVAS LAYER ---------- */
    #universeCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* ---------- UI OVERLAY ---------- */
    #uiOverlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }
    #uiOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* ---------- INPUT PANEL ---------- */
    .input-panel {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 48px 40px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      pointer-events: auto;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
      animation: floatIn 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(40px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .input-panel .icon {
      font-size: 3rem;
      margin-bottom: 8px;
      animation: pulseGlow 2.8s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(108, 99, 255, 0.3)); }
      50% { filter: drop-shadow(0 0 60px rgba(108, 99, 255, 0.6)); }
    }

    .input-panel h1 {
      color: #f0ecff;
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-family: 'Georgia', serif;
    }
    .input-panel h1 strong {
      font-weight: 700;
      background: linear-gradient(135deg, #6c63ff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .input-panel .sub {
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.85rem;
      margin-bottom: 28px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 300;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .input-group label {
      display: block;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }
    .input-group input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: #f0ecff;
      font-size: 1.05rem;
      transition: border-color 0.3s, box-shadow 0.3s;
      outline: none;
      font-family: inherit;
    }
    .input-group input:focus {
      border-color: rgba(108, 99, 255, 0.4);
      box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.1);
    }
    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .btn-generate {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #6c63ff, #8b7cf7);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }
    .btn-generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(108, 99, 255, 0.35);
    }
    .btn-generate:active {
      transform: scale(0.97);
    }
    .btn-generate .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transform: scale(0);
      animation: rippleAnim 0.8s ease-out forwards;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    .form-error {
      color: #f87171;
      font-size: 0.8rem;
      min-height: 24px;
      opacity: 0;
      transition: opacity 0.3s;
      margin-top: 4px;
    }
    .form-error.visible {
      opacity: 1;
    }

    /* ---------- SECRET ENDING ---------- */
    #secretEnding {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 3s ease;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
    }
    #secretEnding.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #secretEnding .text {
      font-family: 'Georgia', serif;
      font-size: clamp(1.2rem, 4vw, 2.4rem);
      color: #f0ecff;
      text-align: center;
      max-width: 600px;
      padding: 30px;
      line-height: 1.6;
      letter-spacing: 1px;
      animation: fadeInText 4s ease forwards;
      text-shadow: 0 0 60px rgba(108, 99, 255, 0.2);
    }
    @keyframes fadeInText {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* ---------- EASTER EGG INDICATOR ---------- */
    #easterEggHint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      color: rgba(255, 255, 255, 0.08);
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      pointer-events: none;
      font-weight: 300;
      transition: opacity 2s ease;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 480px) {
      .input-panel {
        padding: 32px 20px 28px;
        border-radius: 24px;
      }
      .input-panel h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>

  <!-- SCENE CONTAINER -->
  <div id="scene"></div>

  <!-- UNIVERSE CANVAS -->
  <canvas id="universeCanvas"></canvas>

  <!-- UI OVERLAY -->
  <div id="uiOverlay">
    <div class="input-panel">
      <div class="icon">🌌</div>
      <h1>Project <strong>Aurora</strong></h1>
      <p class="sub">A Friendship Universe</p>

      <form id="nameForm">
        <div class="input-group">
          <label for="name1">Your name</label>
          <input type="text" id="name1" placeholder="Enter your name" maxlength="30" autocomplete="off" />
        </div>
        <div class="input-group">
          <label for="name2">Friend's name</label>
          <input type="text" id="name2" placeholder="Enter friend's name" maxlength="30" autocomplete="off" />
        </div>
        <div class="form-error" id="formError">✨ Both names are needed to create a universe</div>
        <button type="submit" class="btn-generate" id="generateBtn">
          <span>✦ Create Universe ✦</span>
        </button>
      </form>
    </div>
  </div>

  <!-- SECRET ENDING -->
  <div id="secretEnding">
    <div class="text">
      "Some friendships aren't written in books...<br>
      they're written across the universe."
    </div>
  </div>

  <!-- EASTER EGG HINT -->
  <div id="easterEggHint">✦ tap the stars ✦</div>

  <script>
    // ============================================================
    // PROJECT AURORA — Full Universe Experience
    // ============================================================

    // ---------- CANVAS SETUP ----------
    const canvas = document.getElementById('universeCanvas');
    const ctx = canvas.getContext('2d');
    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // ---------- STATE ----------
    const state = {
      name1: '',
      name2: '',
      phase: 0, // 0=idle, 1=birth, 2=stars, 3=galaxy, 4=constellation, 5=planet, 6=memory, 7=secret
      progress: 0,
      stars: [],
      particles: [],
      constellation: [],
      planet: null,
      memories: [],
      heartbeat: 0,
      time: 0,
      isActive: false,
      secretShown: false,
    };

    // ---------- STAR CLASS ----------
    class Star {
      constructor(x, y, size, color) {
        this.x = x || Math.random() * W;
        this.y = y || Math.random() * H;
        this.size = size || 1 + Math.random() * 2.5;
        this.baseSize = this.size;
        this.color = color || `hsl(${220 + Math.random() * 40}, 60%, ${60 + Math.random() * 30}%)`;
        this.twinkleSpeed = 0.5 + Math.random() * 1.5;
        this.twinkleOffset = Math.random() * Math.PI * 2;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.life = 1;
        this.targetX = x || Math.random() * W;
        this.targetY = y || Math.random() * H;
        this.phase = 0;
      }

      update(time) {
        const pulse = Math.sin(time * this.twinkleSpeed + this.twinkleOffset) * 0.3 + 0.7;
        this.size = this.baseSize * pulse;

        // Heartbeat pulse for galaxy phase
        if (state.phase >= 3) {
          const beat = Math.sin(state.heartbeat) * 0.15 + 0.85;
          this.size *= beat;
        }

        // Movement toward target for constellation
        if (state.phase === 4) {
          this.x += (this.targetX - this.x) * 0.008;
          this.y += (this.targetY - this.y) * 0.008;
        }

        // Drift for memory phase
        if (state.phase === 6) {
          this.vy -= 0.02;
          this.size *= 0.998;
          this.life -= 0.001;
        }
      }

      draw(ctx) {
        if (this.life < 0.05) return;
        ctx.save();
        ctx.globalAlpha = this.life * 0.8;
        const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
        glow.addColorStop(0, this.color);
        glow.addColorStop(1, 'transparent');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = this.size * 6;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ---------- PARTICLE SYSTEM ----------
    class Particle {
      constructor(x, y, color) {
        this.x = x || W / 2;
        this.y = y || H / 2;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8;
        this.size = 2 + Math.random() * 4;
        this.color = color || `hsl(${220 + Math.random() * 60}, 80%, 70%)`;
        this.life = 1;
        this.decay = 0.005 + Math.random() * 0.01;
        this.gravity = 0.02;
        this.targetX = W / 2 + (Math.random() - 0.5) * 200;
        this.targetY = H / 2 + (Math.random() - 0.5) * 200;
        this.phase = 0;
      }

      update() {
        this.phase += 0.02;
        // Attraction to target
        this.vx += (this.targetX - this.x) * 0.002;
        this.vy += (this.targetY - this.y) * 0.002;
        this.vx *= 0.99;
        this.vy *= 0.99;
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;

        // Heartbeat pulse
        if (state.phase >= 3) {
          const beat = Math.sin(state.heartbeat) * 0.5 + 1;
          this.size *= beat;
        }
      }

      draw(ctx) {
        if (this.life < 0.01) return;
        ctx.save();
        ctx.globalAlpha = this.life * 0.9;
        const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
        glow.addColorStop(0, this.color);
        glow.addColorStop(1, 'transparent');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // ---------- PLANET CLASS ----------
    class Planet {
      constructor(name1, name2) {
        this.name = `${name1} × ${name2}`;
        this.x = W / 2;
        this.y = H / 2;
        this.radius = 60;
        this.rotation = 0;
        this.satellites = [];
        this.color1 = '#6c63ff';
        this.color2 = '#a78bfa';

        // Create satellites
        const emojis = ['💙', '✨', '⭐', '💕', '🌠', '💫'];
        for (let i = 0; i < 8; i++) {
          this.satellites.push({
            angle: (i / 8) * Math.PI * 2,
            distance: 90 + Math.random() * 40,
            size: 16 + Math.random() * 10,
            emoji: emojis[i % emojis.length],
            speed: 0.3 + Math.random() * 0.4,
            phase: Math.random() * Math.PI * 2,
          });
        }
      }

      update() {
        this.rotation += 0.005;
        this.satellites.forEach(s => {
          s.angle += s.speed * 0.008;
        });
      }

      draw(ctx) {
        ctx.save();

        // Planet glow
        const glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 3);
        glow.addColorStop(0, 'rgba(108,99,255,0.15)');
        glow.addColorStop(1, 'transparent');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius * 3, 0, Math.PI * 2);
        ctx.fill();

        // Planet body
        const grad = ctx.createRadialGradient(
          this.x - this.radius * 0.3, this.y - this.radius * 0.3, 0,
          this.x, this.y, this.radius
        );
        grad.addColorStop(0, this.color2);
        grad.addColorStop(0.5, this.color1);
        grad.addColorStop(1, '#2a1f6e');
        ctx.fillStyle = grad;
        ctx.shadowColor = this.color1;
        ctx.shadowBlur = 40;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Planet rings
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.ellipse(this.x, this.y, this.radius * (1.4 + i * 0.15), this.radius * 0.3 + i * 0.05, this.rotation * 0.3 + i, 0, Math.PI * 2);
          ctx.stroke();
        }

        // Name label
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#f0ecff';
        ctx.font = '16px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(this.name, this.x, this.y - this.radius - 20);

        // Satellites
        this.satellites.forEach(s => {
          const sx = this.x + Math.cos(s.angle) * s.distance;
          const sy = this.y + Math.sin(s.angle) * s.distance;
          ctx.font = `${s.size}px serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(s.emoji, sx, sy);

          // Orbit trail
          ctx.strokeStyle = 'rgba(255,255,255,0.04)';
          ctx.lineWidth = 1;
          ctx.setLineDash([2, 8]);
          ctx.beginPath();
          ctx.arc(this.x, this.y, s.distance, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        });

        ctx.restore();
      }
    }

    // ---------- MEMORY CLASS ----------
    class Memory {
      constructor(text, x, y) {
        this.text = text;
        this.x = x || Math.random() * W;
        this.y = y || H + 50;
        this.vy = -0.4 - Math.random() * 0.8;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.size = 14 + Math.random() * 12;
        this.life = 1;
        this.color = `hsl(${200 + Math.random() * 60}, 80%, ${65 + Math.random() * 25}%)`;
        this.rotation = (Math.random() - 0.5) * 0.5;
      }

      update() {
        this.y += this.vy;
        this.x += this.vx + Math.sin(this.y * 0.01) * 0.2;
        this.life -= 0.003;
        this.rotation += 0.01;
      }

      draw(ctx) {
        if (this.life < 0.01) return;
        ctx.save();
        ctx.globalAlpha = this.life * 0.8;
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 20;
        ctx.font = `${this.size}px "Segoe UI", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.text, 0, 0);
        ctx.restore();
      }
    }

    // ---------- CONSTELLATION ----------
    const constellationLines = [
      'Dear friend,',
      'Thank you for being you.',
      'Every moment with you',
      'Is a star in my sky.',
      'Happy Friendship Day 💙'
    ];

    function buildConstellation() {
      const points = [];
      const cx = W / 2;
      const cy = H / 2 - 50;
      const radius = 160;
      const count = constellationLines.length + 1;

      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
        const r = radius * (0.7 + Math.random() * 0.3);
        points.push({
          x: cx + Math.cos(angle) * r,
          y: cy + Math.sin(angle) * r,
          targetX: cx + Math.cos(angle) * r,
          targetY: cy + Math.sin(angle) * r,
          text: constellationLines[i] || '',
        });
      }
      return points;
    }

    // ---------- INIT UNIVERSE ----------
    function initUniverse() {
      state.stars = [];
      state.particles = [];
      state.memories = [];

      // Create background stars
      for (let i = 0; i < 400; i++) {
        state.stars.push(new Star(
          Math.random() * W,
          Math.random() * H,
          0.5 + Math.random() * 2,
          `hsl(${200 + Math.random() * 60}, 50%, ${50 + Math.random() * 30}%)`
        ));
      }

      // Create nebula particles
      for (let i = 0; i < 80; i++) {
        const p = new Particle(
          W / 2 + (Math.random() - 0.5) * 600,
          H / 2 + (Math.random() - 0.5) * 400,
          `hsl(${240 + Math.random() * 60}, 70%, ${60 + Math.random() * 30}%)`
        );
        p.size = 8 + Math.random() * 20;
        p.decay = 0.001;
        state.particles.push(p);
      }

      state.planet = null;
      state.constellation = [];
      state.secretShown = false;
      document.getElementById('secretEnding').classList.remove('visible');
    }

    // ---------- SCENE 1: BIRTH OF A FRIENDSHIP ----------
    function sceneBirth() {
      state.phase = 1;
      state.progress = 0;

      // Create name particles
      const names = `${state.name1} ✦ ${state.name2}`;
      const chars = names.split('');
      const centerX = W / 2;
      const centerY = H / 2;

      chars.forEach((char, i) => {
        const angle = (i / chars.length) * Math.PI * 2;
        const dist = 100 + Math.random() * 200;
        const p = new Particle(
          centerX + Math.cos(angle) * dist + (Math.random() - 0.5) * 100,
          centerY + Math.sin(angle) * dist + (Math.random() - 0.5) * 100,
          `hsl(${240 + Math.random() * 60}, 80%, ${70 + Math.random() * 20}%)`
        );
        p.size = 6 + Math.random() * 8;
        p.targetX = centerX + Math.cos(angle) * 60;
        p.targetY = centerY + Math.sin(angle) * 60;
        p.decay = 0.008;
        p.text = char;
        state.particles.push(p);
      });

      // Add extra sparkle particles
      for (let i = 0; i < 120; i++) {
        const p = new Particle(
          W / 2 + (Math.random() - 0.5) * 600,
